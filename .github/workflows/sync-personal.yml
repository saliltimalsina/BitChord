# Keeps the personal branch up to date with kushagrasinghx/BitChord, then has
# the site (web-personal.yml) and the Android app (android-personal.yml) built
# from it.
#
# What it follows: upstream works on a release branch (v1.9.2, …) for days or
# weeks before merging it into main, so main alone left personal a release
# behind. The newest vX.Y.Z branch is followed whenever it is ahead of main
# (it contains main); otherwise main is. Set FOLLOW=main below to follow only
# releases.
#
# Upstream is merged into personal (never reset or rebased), so the changes
# made here stay. Nothing is pushed unless the merge is clean and the web
# typecheck, tests and build and the Android unit tests pass; otherwise the run
# fails, an issue says what happened, and personal is left as it was.
name: Sync with upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  # To start the personal site and Android builds once personal has moved.
  actions: write

concurrency:
  group: sync-personal
  cancel-in-progress: false

env:
  # "release" follows upstream's newest release branch when it is ahead of
  # main; "main" follows main only.
  FOLLOW: release

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/kushagrasinghx/BitChord.git
          git fetch --no-tags upstream '+refs/heads/*:refs/remotes/upstream/*'

          target=upstream/main
          if [ "$FOLLOW" = "release" ]; then
            newest=$(git for-each-ref --format='%(refname:short)' 'refs/remotes/upstream/v*' \
              | grep -E '^upstream/v[0-9]+(\.[0-9]+)*$' | sort -V | tail -1)
            if [ -n "$newest" ] && git merge-base --is-ancestor upstream/main "$newest" \
              && [ "$(git rev-parse "$newest")" != "$(git rev-parse upstream/main)" ]; then
              target=$newest
            fi
          fi
          echo "target=${target#upstream/}" >> "$GITHUB_OUTPUT"
          echo "upstream=$(git rev-parse --short "$target")" >> "$GITHUB_OUTPUT"
          echo "Following upstream ${target#upstream/} ($(git rev-parse --short "$target"))." >> "$GITHUB_STEP_SUMMARY"

          if git merge-base --is-ancestor "$target" HEAD; then
            echo "Already up to date with upstream ${target#upstream/}." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before=$(git rev-parse HEAD)
          if ! git merge --no-edit -m "Merge upstream ${target#upstream/} into personal" "$target"; then
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$before" HEAD -- web/extension web/shared; then
            echo "extension=false" >> "$GITHUB_OUTPUT"
          else
            echo "extension=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.merge.outputs.changed == 'true'
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        if: steps.merge.outputs.changed == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Web install, typecheck, test, build
        if: steps.merge.outputs.changed == 'true'
        working-directory: web
        env:
          BITCHORD_SITE_ORIGINS: https://music.saliltimalsina.com.np,http://localhost:5173
          VITE_PARTY_SERVER_URL: https://api.bitchord.kushagrasingh.in
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build:site

      # The Android app's unit tests too, so a merge that breaks the app (as a
      # string without its translations did) never reaches personal.
      - uses: actions/setup-java@v4
        if: steps.merge.outputs.changed == 'true'
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.merge.outputs.changed == 'true'

      - name: Android unit tests
        if: steps.merge.outputs.changed == 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDevDebugUnitTest

      # Only now, with everything passing, does personal move.
      - name: Push personal
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:personal

      # A push made with this job's token doesn't start other workflows, so the
      # site deploy and the Android build are asked for by name.
      - name: Deploy the site and build the Android app
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run web-personal.yml --ref personal
          gh workflow run android-personal.yml --ref personal

      - name: Remind to reload the extension
        if: steps.merge.outputs.changed == 'true' && steps.merge.outputs.extension == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Reload the BitChord extension (upstream ${{ steps.merge.outputs.target }} ${{ steps.merge.outputs.upstream }})" \
            --body "Upstream changed the extension. On your Mac run \`git pull && pnpm --dir web install && BITCHORD_SITE_ORIGINS=https://music.saliltimalsina.com.np,http://localhost:5173 pnpm --dir web/extension build\` on the personal branch, then click ↻ on BitChord in chrome://extensions." \
            || echo "::warning::Couldn't open an issue (are issues enabled on this repo?)."

      - name: Report a problem
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.merge.outputs.conflict }}" = "true" ]; then
            reason="Upstream ${{ steps.merge.outputs.target }} conflicts with this branch in:"$'\n\n'"$(sed 's/^/- /' conflicts.txt)"$'\n\n'"Merge upstream/${{ steps.merge.outputs.target }} into personal by hand to choose what to keep."
          else
            reason="The merge of upstream ${{ steps.merge.outputs.target }} was clean, but the web typecheck, tests or build, or the Android unit tests failed."
          fi
          body="$reason"$'\n\n'"Nothing was pushed; personal, the site and the app are as they were."$'\n\n'"Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          # The run still fails, so GitHub's failed-run email goes out either way.
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Upstream sync needs a hand (upstream ${{ steps.merge.outputs.target }} ${{ steps.merge.outputs.upstream }})" \
            --body "$body" \
            || echo "::warning::Couldn't open an issue (are issues enabled on this repo?)."
